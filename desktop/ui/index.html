<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bigi</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0f1419; color: #e7e9ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
      }
      .dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: #ff2e88; animation: pulse 1s ease-in-out infinite;
      }
      .title { font-size: 15px; letter-spacing: 0.3px; opacity: 0.85; }
      .sub { font-size: 12px; opacity: 0.45; }
      @keyframes pulse {
        0%, 100% { transform: scale(0.7); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <div class="title">Starting bigi…</div>
      <div class="sub">launching the local engine</div>
    </div>
  </body>
</html>
